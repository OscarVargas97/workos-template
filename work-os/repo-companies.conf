# Pre-mapeo repo->destino para migrate-pc.sh (perfil de ESTA máquina) -
# evita preguntar la empresa/destino de cada repo en cada corrida.
# Formato: ruta-relativa-a-$HOME=empresa=nombre-destino
#   - nombre-destino vacío = NO migrar este repo (duplicado/descartado).
#   - empresa vacía + nombre-destino con valor = repo externo/personal,
#     va a Repos/Externos/<nombre-destino>.
#   - empresa con valor = va a Repos/<Empresa>/<nombre-destino> (puede
#     incluir una subcarpeta, ej. "Grupo/repo").
# Editable a mano; migrate-pc.sh agrega acá lo que le respondas para un
# repo que todavía no esté listado.
